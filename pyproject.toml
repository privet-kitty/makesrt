[project]
name = "makesrt"
version = "0.1.0"
description = "Transcribe speech from video and make an srt file"
authors = [
    { name = "Hugo Sansaqua", email = "privet.kitty99@gmail.com" },
]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pvleopard>=1.1.4,<2",
    "ffmpeg-python>=0.2.0,<0.3",
]

[project.scripts]
makesrt = "makesrt:main"

[dependency-groups]
dev = [
    "poethepoet>=0.18.1,<0.19",
    "black>=22.12.0,<23",
    "mypy>=0.991,<0.992",
    "flake8>=6.0.0,<7",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.poe.tasks]
srt = "python -m makesrt"

[[tool.mypy.overrides]]
module = ["ffmpeg", "pvleopard"]
ignore_missing_imports = true
